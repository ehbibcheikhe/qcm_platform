{% extends 'admin/base_admin.html' %}
{% block admin_content %}
<h4 class="fw-bold mb-4"><i class="bi bi-tags"></i> {{ t.manage_categories }}</h4>

<div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
  <form method="POST" class="row g-2">
    <div class="col-md-4"><input type="text" name="name_ar" class="form-control" placeholder="الاسم (عربي)" required></div>
    <div class="col-md-4"><input type="text" name="name_fr" class="form-control" placeholder="Nom (français)" required></div>
    <div class="col-md-3"><input type="text" name="icon" class="form-control" placeholder="bi-icon-name (bootstrap-icons)"></div>
    <div class="col-md-1"><button class="btn btn-primary-custom w-100"><i class="bi bi-plus-lg"></i></button></div>
  </form>
</div>

<div class="card border-0 shadow-sm rounded-4 p-3">
  <table class="table align-middle mb-0">
    <thead><tr><th>{{ t.name }} (AR)</th><th>{{ t.name }} (FR)</th><th></th><th>{{ t.actions }}</th></tr></thead>
    <tbody>
    {% for c in categories %}
      <tr>
        <td>{{ c.name_ar }}</td>
        <td>{{ c.name_fr }}</td>
        <td><i class="bi {{ c.icon }}"></i></td>
        <td>
          <form method="POST" action="{{ url_for('admin_category_delete', cat_id=c.id) }}" onsubmit="return confirm('{{ t.confirm_delete }}')" class="d-inline">
            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
          </form>
        </td>
      </tr>
    {% else %}
      <tr><td colspan="4" class="text-center text-muted py-3">{{ t.no_data }}</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
