{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-0 shadow-sm rounded-4 p-4">
      <h4 class="fw-bold text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> {{ t.login }}</h4>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">{{ t.username }} / {{ t.email }}</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">{{ t.password }}</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary-custom w-100">{{ t.login }}</button>
      </form>
      <p class="text-center text-muted small mt-3 mb-0">
        {{ t.no_account }} <a href="{{ url_for('register') }}">{{ t.register }}</a>
      </p>
      <p class="text-center text-muted small mt-2 mb-0">
        <em>Demo admin: admin / admin123</em>
      </p>
    </div>
  </div>
</div>
{% endblock %}
